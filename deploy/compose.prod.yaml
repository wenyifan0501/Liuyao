# Production stack: PostgreSQL + API + Caddy (HTTPS, static SPA, /api proxy).
# Usage:
#   cp deploy/.env.production.example deploy/.env.prod   # then fill in the secrets
#   docker compose --env-file deploy/.env.prod -f deploy/compose.prod.yaml up -d --build
name: liuyao

services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: liuyao
      POSTGRES_DB: liuyao
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env.prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liuyao -d liuyao"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    # No ports: the database is reachable only from the compose network.

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in deploy/.env.prod}
      APP_ORIGIN: https://${SITE_ADDRESS:?Set SITE_ADDRESS in deploy/.env.prod}
      HOST: 0.0.0.0
      PORT: "3000"
      # Only the compose network may set X-Forwarded-For; never use "true".
      TRUST_PROXY: ${TRUST_PROXY:-172.16.0.0/12}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?Set DEEPSEEK_API_KEY in deploy/.env.prod}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_THINKING: ${DEEPSEEK_THINKING:-enabled}
      DEEPSEEK_REASONING_EFFORT: ${DEEPSEEK_REASONING_EFFORT:-high}
      DEEPSEEK_STREAM: ${DEEPSEEK_STREAM:-true}
      WEB_AI_ENABLED: ${WEB_AI_ENABLED:-true}
      WEB_QUOTA_ENFORCED: ${WEB_QUOTA_ENFORCED:-true}
      WEB_AI_USER_DAILY_CALLS: ${WEB_AI_USER_DAILY_CALLS:-5}
      WEB_AI_DAILY_TOKEN_BUDGET: ${WEB_AI_DAILY_TOKEN_BUDGET:-600000}
      SKILL_ROOT: Skill
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"
    # Single instance on purpose: the AI worker uses in-process polling plus
    # advisory locks, and per-route rate limits live in process memory.
    restart: unless-stopped

  caddy:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS in deploy/.env.prod}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
