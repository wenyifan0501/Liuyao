# Local foundation only. API binds to loopback and uses development cookies.
# Public deployment needs the HTTPS gateway and production settings documented below.
services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: liuyao
      POSTGRES_DB: liuyao
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liuyao -d liuyao"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  api:
    profiles: ["api"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment:
      NODE_ENV: development
      DATABASE_URL: ${CONTAINER_DATABASE_URL:?Set CONTAINER_DATABASE_URL in deploy/.env}
      APP_ORIGIN: http://localhost:3000
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_THINKING: ${DEEPSEEK_THINKING:-enabled}
      DEEPSEEK_REASONING_EFFORT: ${DEEPSEEK_REASONING_EFFORT:-high}
      WEB_AI_ENABLED: ${WEB_AI_ENABLED:-true}
      WEB_AI_DAILY_TOKEN_BUDGET: ${WEB_AI_DAILY_TOKEN_BUDGET:-2400000}
      WEB_AI_USER_DAILY_CALLS: ${WEB_AI_USER_DAILY_CALLS:-12}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
volumes:
  postgres_data:
