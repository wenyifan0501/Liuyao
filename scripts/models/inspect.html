<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {MeshoptDecoder} from 'three/addons/libs/meshopt_decoder.module.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
const q=new URLSearchParams(location.search),W=360;
const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});r.setSize(W*4,W);document.body.appendChild(r.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#cfc8b8');

  views.forEach((v,i)=>{const cam=new THREE.PerspectiveCamera(30,1,.01,100);cam.position.copy(c).add(new THREE.Vector3(...v).normalize().multiplyScalar(s*1.9));cam.lookAt(c);
    r.setViewport(i*W,0,W,W);r.setScissor(i*W,0,W,W);r.render(scene,cam);});
  const sz=box.getSize(new THREE.Vector3());document.title='ready '+[sz.x,sz.y,sz.z].map(n=>n.toFixed(3)).join(' ')+' min '+[box.min.x,box.min.y,box.min.z].map(n=>n.toFixed(3)).join(' ');
});
</script></body></html>
